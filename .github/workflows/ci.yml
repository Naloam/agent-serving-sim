name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,viz]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke-run first experiment
        run: python experiments/exp001_lru_vs_ttl.py --seed 42 --sessions 30 --out-dir /tmp/results
